name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  # The export job deletes the older builds it replaces.
  actions: write

env:
  GODOT_VERSION: "4.7.2"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (gdtoolkit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: gdlint $(git ls-files '*.gd' ':!:addons/*')
      - run: gdformat --check $(git ls-files '*.gd' ':!:addons/*')
      # The tests run in two jobs by folder (see `test`): a folder left out of both would
      # silently never run.
      - name: Every test folder is in a test job
        run: |
          status=0
          for dir in tests/*/; do
            grep -q "res://${dir%/}[,\"]" .github/workflows/ci.yml || { echo "::error::${dir} is in no test job"; status=1; }
          done
          for file in tests/*.gd; do
            [ -e "$file" ] && { echo "::error::$file must live in a folder"; status=1; }
          done
          exit $status

  test:
    name: Tests (${{ matrix.group }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Two halves of similar length (~6 min each on PR #45): the integration suites that
        # play Carmenca, and everything else. Every folder of tests/ must be in one of them
        # (the lint job checks it).
        include:
          - group: Carmenca
            paths: "res://tests/world,res://tests/systems"
          - group: Sistemas
            paths: "res://tests/allies,res://tests/audio,res://tests/characters,res://tests/codex,res://tests/combat,res://tests/core,res://tests/dialogue,res://tests/enemies,res://tests/interaction,res://tests/physics,res://tests/player,res://tests/tools,res://tests/training,res://tests/ui"
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: godot-gdunit-labs/gdUnit4-action@v1.4.2
        with:
          godot-version: ${{ env.GODOT_VERSION }}
          version: installed
          paths: ${{ matrix.paths }}
          # Minutes per half. The whole suite took 8m44s on PR #32, ~14 min on PR #45 (then
          # split in two).
          timeout: 15
          # The check-run report (dorny/test-reporter) fails with HTTP 404 when it updates
          # its own check run, although all tests pass: first on push to main (F1
          # close-out), then on PR #27 (F3). It is a convenience view, so it stays off.
          # Failing tests still fail this job (non-zero exit code).
          publish-report: false
          # No report artifact either: the failures are in the job log, and on PR #43 the
          # upload failed the job (artifact storage quota hit) although every test passed.
          upload-report: false

  export:
    name: Export ${{ matrix.preset }}
    needs: [lint, test]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Linux
            output: build/linux/el-despertar-del-sol.x86_64
          - preset: Windows
            output: build/windows/el-despertar-del-sol.exe
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v5
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-stable-templates

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Export ${{ matrix.preset }}
        run: |
          mkdir -p "$(dirname '${{ matrix.output }}')"
          ~/godot/godot --headless --path . --export-release "${{ matrix.preset }}" "${{ matrix.output }}"
          test -s "${{ matrix.output }}"

      - name: Smoke-run Linux build
        if: matrix.preset == 'Linux'
        run: timeout 60 ./${{ matrix.output }} --headless --quit-after 10

      # Builds are kept only from main and manual runs: a pull request is played from its
      # branch. The private repository's artifact storage is small (~500 MB) and each
      # build is ~30-40 MB zipped: keeping one per merge filled it twice (PR #43, PR #49).
      # So the older builds of this platform are removed first (an upload over quota
      # fails), and only the newest is kept.
      - name: Remove older ${{ matrix.preset }} builds
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: el-despertar-del-sol-${{ matrix.preset }}-
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name | startswith(\"${PREFIX}\")) | .id" |
          while read -r id; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: el-despertar-del-sol-${{ matrix.preset }}-${{ github.sha }}
          path: ${{ matrix.output }}
          retention-days: 7
